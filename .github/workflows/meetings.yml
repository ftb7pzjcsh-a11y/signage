name: Meetings board

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meetings
  cancel-in-progress: false

jobs:
  meetings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the Programme of Meetings
        run: node scripts/meetings.mjs

      - name: Save meetings.json
        run: |
          if [ -n "$(git status --porcelain meetings/meetings.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add meetings/meetings.json
            git commit -m "Update meetings"
            git pull --rebase --autostash
            git push
          else
            echo "Nothing to save."
          fi
